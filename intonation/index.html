<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../global.css" />
    <link rel="icon" type="image/ico" href="../favicon.ico" />
    <script src="defer.js" defer></script>
    <script
      id="MathJax-script"
      async
      src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"
    ></script>
    <title>Intonation</title>
  </head>
  <body>
    <header>
      <a href="../">← Homepage</a>
      <h1>Intonation</h1>
    </header>
    <div id="selection-container">
      <div id="intonation-select-container" class="no-select">
        <select id="root-select" class="no-select">
          <option value="" disabled selected>-</option>
          <option value="-9">C</option>
          <option value="-8">C♯/D♭</option>
          <option value="-7">D</option>
          <option value="-6">D♯/E♭</option>
          <option value="-5">E</option>
          <option value="-4">F</option>
          <option value="-3">F♯/G♭</option>
          <option value="-2">G</option>
          <option value="-1">G♯/A♭</option>
          <option value="0">A</option>
          <option value="1">A♯/B♭</option>
          <option value="2">B</option>
        </select>
        <select id="intonation-select" class="no-select">
          <option value="" disabled selected>-</option>
          <option value="12tet">Equal temperament (12TET)</option>
          <option value="5just">5-limit just intonation</option>
          <option value="pythagorean">Pythagorean tuning</option>
        </select>
      </div>
    </div>
    <div id="output-container">
      <table id="output">
        <tr>
          <th class="no-select">Note</th>
          <th class="no-select">Frequency</th>
        </tr>
        <tr>
          <th class="no-select">C</th>
        </tr>
        <tr>
          <th class="no-select">C♯/D♭</th>
        </tr>
        <tr>
          <th class="no-select">D</th>
        </tr>
        <tr>
          <th class="no-select">D♯/E♭</th>
        </tr>
        <tr>
          <th class="no-select">E</th>
        </tr>
        <tr>
          <th class="no-select">F</th>
        </tr>
        <tr>
          <th class="no-select">F♯/G♭</th>
        </tr>
        <tr>
          <th class="no-select">G</th>
        </tr>
        <tr>
          <th class="no-select">G♯/A♭</th>
        </tr>
        <tr>
          <th class="no-select">A</th>
        </tr>
        <tr>
          <th class="no-select">A♯/B♭</th>
        </tr>
        <tr>
          <th class="no-select">B</th>
        </tr>
        <tr>
          <th class="no-select">C</th>
        </tr>
      </table>
      <div id="actions-container">
        <button class="no-select" onclick="playScale([...frequencies])">
          Play scale
        </button>
        <button
          onclick="
            playScale([
              frequencies[0],
              frequencies[2],
              frequencies[4],
              frequencies[5],
              frequencies[7],
              frequencies[9],
              frequencies[11],
              frequencies[12],
            ])
          "
          class="no-select"
        >
          Play major scale
        </button>
        <button
          onclick="
            playScale([
              frequencies[0],
              frequencies[2],
              frequencies[3],
              frequencies[5],
              frequencies[7],
              frequencies[8],
              frequencies[10],
              frequencies[12],
            ])
          "
          class="no-select"
        >
          Play minor scale
        </button>
      </div>
      <h2>Mathematical formula</h2>
      <p id="output-latex"></p>
    </div>
  </body>
</html>
